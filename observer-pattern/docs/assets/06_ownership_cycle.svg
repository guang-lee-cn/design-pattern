<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 432" width="680" height="432" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98a8"/>
    </marker>
    <marker id="arw-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arw-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="680" height="432" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#1f2937">谁持有谁：环，以及环的两种破法</text>
  <text x="24" y="50" font-size="11.5" fill="#5b6472">两条边由两个不同的需求分别写出 —— Display 要「拉」当前值，Sensor 要「推」通知。</text>
  <text x="24" y="66" font-size="11.5" fill="#5b6472">第 3 节说名单放在哪决定解耦程度；这一节说名单放在哪，还决定它什么时候被收回。</text>

  <!-- ============ 上块：环 ============ -->
  <text x="24" y="102" font-size="12" font-weight="700" fill="#1f2937">环：两条边都是强引用</text>

  <rect x="24" y="128" width="120" height="48" rx="4" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="84" y="157" font-size="11" fill="#1f2937" text-anchor="middle">Display</text>

  <rect x="274" y="128" width="120" height="48" rx="4" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="334" y="157" font-size="11" fill="#1f2937" text-anchor="middle">Sensor</text>

  <path d="M 144 141 H 268" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#arw-r)"/>
  <text x="206" y="134" font-size="9.5" fill="#b91c1c" text-anchor="middle">shared_ptr</text>

  <path d="M 274 163 H 150" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#arw-r)"/>
  <text x="212" y="181" font-size="9.5" fill="#b91c1c" text-anchor="middle">vector&lt;shared_ptr&gt;</text>

  <rect x="418" y="128" width="238" height="48" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="432" y="148" font-size="10.5" fill="#b91c1c">Sensor &#160;built 1 · destroyed 0</text>
  <text x="432" y="166" font-size="10.5" fill="#b91c1c">Display built 1 · destroyed 0</text>

  <text x="24" y="206" font-size="11" fill="#5b6472">main 把两个外部引用都 reset 之后，两边的析构函数一次都没跑 —— 两个对象一起泄漏。</text>

  <!-- ============ 下块：破环 ============ -->
  <text x="24" y="240" font-size="12" font-weight="700" fill="#1f2937">破法：把「推」的那一侧降级为非拥有</text>

  <rect x="24" y="266" width="120" height="48" rx="4" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="84" y="295" font-size="11" fill="#1f2937" text-anchor="middle">Display</text>

  <rect x="274" y="266" width="120" height="48" rx="4" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="334" y="295" font-size="11" fill="#1f2937" text-anchor="middle">Sensor</text>

  <path d="M 144 279 H 268" stroke="#8b98a8" stroke-width="1.5" fill="none" marker-end="url(#arw)"/>
  <text x="206" y="272" font-size="9.5" fill="#5b6472" text-anchor="middle">shared_ptr（不变）</text>

  <path d="M 274 301 H 150" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arw-g)"/>
  <text x="212" y="319" font-size="9.5" fill="#15803d" text-anchor="middle">weak_ptr（非拥有）</text>

  <rect x="418" y="266" width="238" height="48" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="432" y="286" font-size="10.5" fill="#15803d">Sensor &#160;built 1 · destroyed 1</text>
  <text x="432" y="304" font-size="10.5" fill="#15803d">Display built 1 · destroyed 1</text>

  <text x="24" y="340" font-size="11" fill="#5b6472">接收方先走时，weak_ptr::lock() 失败，槽被就地跳过 —— 实测 live receivers: 0 of 1。</text>

  <!-- ============ 结论 ============ -->
  <rect x="24" y="356" width="632" height="70" rx="6" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="40" y="380" font-size="10.5" fill="#1f2937">KP88（1988）：release「removes the view from its model's dependents collection, breaking reference circularities」。</text>
  <text x="40" y="398" font-size="10.5" fill="#1f2937">GoF94（1994）：反过来 —— 让 subject 在析构时通知 observers，让它们自己把引用清掉。</text>
  <text x="40" y="416" font-size="10.5" fill="#5b6472">两种处方指向同一件事：注销不是可选操作，是关闭协议的一部分。</text>
</svg>
