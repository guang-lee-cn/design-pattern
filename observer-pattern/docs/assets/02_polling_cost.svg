<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="680" height="400" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#1f2937">轮询的三份账</text>
  <text x="24" y="50" font-size="12" fill="#5b6472">抽样时机与「值什么时候变」无关 —— 空转、延迟、漏报是同一个原因的三个面。</text>

  <!-- 列标题 -->
  <text x="96" y="86" font-size="11.5" font-weight="700" fill="#0c447c">读数次数（空转）</text>
  <text x="320" y="86" font-size="11.5" font-weight="700" fill="#b3261e">最大延迟</text>
  <text x="478" y="86" font-size="10.5" fill="#8a929c">（同一批数据，两个方向）</text>

  <!-- 行 1 -->
  <text x="28" y="108" font-size="11" fill="#5b6472">1 tick</text>
  <rect x="96" y="94" width="150" height="20" rx="3" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="254" y="108" font-size="11" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">120 次</text>
  <rect x="320" y="94" width="5" height="20" rx="2" fill="#fde8e8" stroke="#e57373"/>
  <text x="478" y="108" font-size="11" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">5 ms</text>

  <!-- 行 2 -->
  <text x="28" y="136" font-size="11" fill="#5b6472">2 tick</text>
  <rect x="96" y="122" width="75" height="20" rx="3" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="254" y="136" font-size="11" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">60 次</text>
  <rect x="320" y="122" width="12" height="20" rx="2" fill="#fde8e8" stroke="#e57373"/>
  <text x="478" y="136" font-size="11" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">15 ms</text>

  <!-- 行 3 -->
  <text x="28" y="164" font-size="11" fill="#5b6472">4 tick</text>
  <rect x="96" y="150" width="38" height="20" rx="3" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="254" y="164" font-size="11" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">30 次</text>
  <rect x="320" y="150" width="27" height="20" rx="2" fill="#fde8e8" stroke="#e57373"/>
  <text x="478" y="164" font-size="11" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">35 ms</text>

  <!-- 行 4 -->
  <text x="28" y="192" font-size="11" fill="#5b6472">8 tick</text>
  <rect x="96" y="178" width="18" height="20" rx="3" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="254" y="192" font-size="11" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">14 次</text>
  <rect x="320" y="178" width="58" height="20" rx="2" fill="#fde8e8" stroke="#e57373"/>
  <text x="478" y="192" font-size="11" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">75 ms</text>

  <!-- 行 5 -->
  <text x="28" y="220" font-size="11" fill="#5b6472">20 tick</text>
  <rect x="96" y="206" width="8" height="20" rx="3" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="254" y="220" font-size="11" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">6 次</text>
  <rect x="320" y="206" width="150" height="20" rx="2" fill="#fde8e8" stroke="#e57373"/>
  <text x="478" y="220" font-size="11" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">195 ms</text>

  <path d="M 24 238 L 656 238" stroke="#e6ebf1" stroke-width="1"/>

  <!-- 漏报率 -->
  <text x="24" y="258" font-size="11.5" font-weight="700" fill="#0c447c">尖峰漏报率（尖峰持续 20 ms，扫描相位）</text>

  <rect x="24" y="268" width="118" height="40" rx="5" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="36" y="293" font-size="10.5" fill="#5b6472">1 tick</text>
  <text x="130" y="294" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="end">0%</text>

  <rect x="154" y="268" width="118" height="40" rx="5" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="166" y="293" font-size="10.5" fill="#5b6472">2 tick</text>
  <text x="260" y="294" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="end">0%</text>

  <rect x="284" y="268" width="118" height="40" rx="5" fill="#fdf6f6" stroke="#e57373"/>
  <text x="296" y="293" font-size="10.5" fill="#5b6472">4 tick</text>
  <text x="390" y="294" font-size="13" font-weight="700" fill="#b3261e" text-anchor="end">50%</text>

  <rect x="414" y="268" width="118" height="40" rx="5" fill="#fde8e8" stroke="#e57373"/>
  <text x="426" y="293" font-size="10.5" fill="#5b6472">8 tick</text>
  <text x="520" y="294" font-size="13" font-weight="700" fill="#b3261e" text-anchor="end">75%</text>

  <rect x="544" y="268" width="118" height="40" rx="5" fill="#fde8e8" stroke="#e57373"/>
  <text x="556" y="293" font-size="10.5" fill="#5b6472">20 tick</text>
  <text x="650" y="294" font-size="13" font-weight="700" fill="#b3261e" text-anchor="end">90%</text>

  <!-- 结论 -->
  <rect x="24" y="320" width="638" height="60" rx="6" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="40" y="342" font-size="12" fill="#1f2937">把周期缩短，换来的是<tspan font-weight="700">延迟变小、空转变多</tspan>；把周期放长，<tspan font-weight="700">空转变小、延迟与漏报一起变大</tspan>。</text>
  <text x="40" y="364" font-size="11" fill="#5b6472">这根轴上没有「好点」——因为抽样时机是拍出来的，不是需求给的。观察者换掉的正是这个：通知由「变化」触发。</text>
</svg>
