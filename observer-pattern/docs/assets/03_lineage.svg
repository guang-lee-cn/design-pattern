<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 445" width="680" height="445" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="680" height="445" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#1f2937">四层的真实位置</text>
  <text x="24" y="50" font-size="11.5" fill="#5b6472">纵轴 = 满足 Eugster 2003 表 1 中解耦维度的项数（共 3 项：空间 / 时间 / 同步）</text>
  <text x="24" y="68" font-size="11" fill="#8a929c">实心点 = 表内直接列出的一行；虚线圈 = 按文档措辞推出，表内没有这一行</text>

  <!-- 网格 -->
  <line x1="160" y1="150" x2="662" y2="150" stroke="#e6ebf1" stroke-width="1"/>
  <line x1="160" y1="205" x2="662" y2="205" stroke="#e6ebf1" stroke-width="1"/>
  <line x1="160" y1="260" x2="662" y2="260" stroke="#e6ebf1" stroke-width="1"/>
  <line x1="160" y1="315" x2="662" y2="315" stroke="#e6ebf1" stroke-width="1"/>

  <text x="150" y="154" font-size="11" fill="#8a929c" text-anchor="end">3 项</text>
  <text x="150" y="209" font-size="11" fill="#8a929c" text-anchor="end">2 项</text>
  <text x="150" y="264" font-size="11" fill="#8a929c" text-anchor="end">1 项</text>
  <text x="150" y="319" font-size="11" fill="#8a929c" text-anchor="end">0 项</text>

  <!-- 斜线：三层共线 -->
  <line x1="180" y1="315" x2="600" y2="150" stroke="#c9d4e2" stroke-width="2"/>

  <!-- 点 -->
  <circle cx="180" cy="315" r="6" fill="#0c447c"/>
  <circle cx="320" cy="260" r="6" fill="#0c447c"/>
  <circle cx="600" cy="150" r="7" fill="#0c447c"/>
  <circle cx="460" cy="205" r="6" fill="#ffffff" stroke="#8a929c" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- 层名 -->
  <text x="180" y="277" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">回调</text>
  <text x="320" y="222" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">观察者</text>
  <text x="600" y="112" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">发布订阅</text>
  <text x="478" y="222" font-size="12" font-weight="700" fill="#5f5e5a">事件总线</text>
  <text x="478" y="240" font-size="11" fill="#8a929c">进程内中介：拿不到时间解耦</text>

  <!-- 名单在哪 -->
  <text x="180" y="337" font-size="11" fill="#5b6472" text-anchor="middle">无名单</text>
  <text x="320" y="282" font-size="11" fill="#5b6472" text-anchor="middle">被观察方</text>
  <text x="600" y="172" font-size="11" fill="#5b6472" text-anchor="middle">跨进程中介</text>

  <!-- 结论 -->
  <rect x="24" y="365" width="638" height="56" rx="6" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="40" y="388" font-size="12" fill="#1f2937">响应式流不在这条线上 —— 它给 3/3 补的是<tspan font-weight="700">第 4 维：速率</tspan>。</text>
  <text x="40" y="408" font-size="11" fill="#5b6472">订阅者用 request(n) 反压、cancel 撤销；JDK 的原话是「避免『推』型系统的资源管理问题」。</text>
</svg>
