<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" width="680" height="396" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="680" height="396" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#1f2937">加一个显示端，改动落在谁身上</text>
  <text x="24" y="50" font-size="12" fill="#5b6472">两条路线改的行数几乎一样（9 行 vs 9 行）—— 区别不在「写多少」，在「改到哪个文件」。</text>

  <!-- ============ 左：硬编码 ============ -->
  <text x="24" y="80" font-size="12" font-weight="700" fill="#b3261e">路线一 · 硬编码调用</text>

  <rect x="24" y="90" width="304" height="42" rx="6" fill="#fde8e8" stroke="#e57373"/>
  <text x="38" y="108" font-size="11.5" font-weight="700" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">sensor.h</text>
  <text x="38" y="124" font-size="10.5" fill="#b3261e">改 2 行 —— 传感器自己被迫回来改</text>

  <rect x="24" y="138" width="304" height="42" rx="6" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="38" y="156" font-size="11.5" font-weight="700" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">display.h</text>
  <text x="38" y="172" font-size="10.5" fill="#5b6472">改 7 行 —— 新增显示端类（两条路线都要付）</text>

  <rect x="24" y="186" width="304" height="42" rx="6" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="38" y="204" font-size="11.5" font-weight="700" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">main.cpp</text>
  <text x="38" y="220" font-size="10.5" fill="#8a929c">改 0 行 —— 但它本来就没参与决策</text>

  <rect x="24" y="240" width="304" height="52" rx="6" fill="#fdf6f6" stroke="#e57373"/>
  <text x="38" y="262" font-size="11.5" font-weight="700" fill="#b3261e">改动落在公共类上</text>
  <text x="38" y="280" font-size="10.5" fill="#5b6472">sensor.h 被 4 个 TU 依赖 → 4 个全部重编</text>

  <!-- ============ 右：持有名单 ============ -->
  <text x="352" y="80" font-size="12" font-weight="700" fill="#1b5e20">路线三 · 持有名单</text>

  <rect x="352" y="90" width="304" height="42" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="366" y="108" font-size="11.5" font-weight="700" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">sensor.h</text>
  <text x="366" y="124" font-size="10.5" fill="#1b5e20">改 0 行 —— 与旧版逐字节相同</text>

  <rect x="352" y="138" width="304" height="42" rx="6" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="366" y="156" font-size="11.5" font-weight="700" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">display.h</text>
  <text x="366" y="172" font-size="10.5" fill="#5b6472">改 7 行 —— 新增显示端类（两条路线都要付）</text>

  <rect x="352" y="186" width="304" height="42" rx="6" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="366" y="204" font-size="11.5" font-weight="700" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">main.cpp</text>
  <text x="366" y="220" font-size="10.5" fill="#5b6472">改 2 行 —— 声明 + 登记，都在组合根</text>

  <rect x="352" y="240" width="304" height="52" rx="6" fill="#f0f7f0" stroke="#a5d6a7"/>
  <text x="366" y="262" font-size="11.5" font-weight="700" fill="#1b5e20">改动落在组合根上</text>
  <text x="366" y="280" font-size="10.5" fill="#5b6472">main.cpp 只被 1 个 TU 依赖 → 1 个重编</text>

  <!-- ============ 结论 ============ -->
  <rect x="24" y="308" width="632" height="62" rx="6" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="40" y="330" font-size="12" fill="#1f2937">同样 9 行改动，一条落在<tspan font-weight="700">被 4 个模块依赖的公共类</tspan>上，一条落在<tspan font-weight="700">只有一处调用的组合根</tspan>上。</text>
  <text x="40" y="352" font-size="11" fill="#5b6472">观察者模式换来的不是「少写代码」，是「把改动挪到不会放大它的地方」。第 6 节接着算：挪过去之后，谁来注销。</text>
</svg>
