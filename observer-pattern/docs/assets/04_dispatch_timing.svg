<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="680" height="440" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#1f2937">分发时机：层 1–3 是嵌套，层 4 是错位</text>
  <text x="24" y="50" font-size="11.5" fill="#5b6472">同一串事件（25.0 / 26.5 / 27.0，两个显示端）。横条长度是示意；实测的是计数，见图中数字。</text>

  <!-- 上半：层 1 / 2 / 3 -->
  <text x="24" y="88" font-size="12" font-weight="700" fill="#1f2937">层 1 / 2 / 3 —— Publish 返回时，接收方已经跑完</text>

  <rect x="34" y="98" width="202" height="56" rx="4" fill="none" stroke="#b8c4d4" stroke-dasharray="3 3"/>
  <rect x="243" y="98" width="202" height="56" rx="4" fill="none" stroke="#b8c4d4" stroke-dasharray="3 3"/>
  <rect x="452" y="98" width="202" height="56" rx="4" fill="none" stroke="#b8c4d4" stroke-dasharray="3 3"/>

  <rect x="40" y="104" width="190" height="16" rx="3" fill="#0c447c"/>
  <rect x="249" y="104" width="190" height="16" rx="3" fill="#0c447c"/>
  <rect x="458" y="104" width="190" height="16" rx="3" fill="#0c447c"/>
  <text x="135" y="116" font-size="11" fill="#ffffff" text-anchor="middle">publish 25.0</text>
  <text x="344" y="116" font-size="11" fill="#ffffff" text-anchor="middle">publish 26.5</text>
  <text x="553" y="116" font-size="11" fill="#ffffff" text-anchor="middle">publish 27.0</text>

  <rect x="48" y="130" width="84" height="16" rx="3" fill="#c9d4e2"/>
  <rect x="136" y="130" width="86" height="16" rx="3" fill="#c9d4e2"/>
  <rect x="257" y="130" width="84" height="16" rx="3" fill="#c9d4e2"/>
  <rect x="345" y="130" width="86" height="16" rx="3" fill="#c9d4e2"/>
  <rect x="466" y="130" width="84" height="16" rx="3" fill="#c9d4e2"/>
  <rect x="554" y="130" width="86" height="16" rx="3" fill="#c9d4e2"/>
  <text x="90" y="142" font-size="10.5" fill="#1f2937" text-anchor="middle">[console]</text>
  <text x="179" y="142" font-size="10.5" fill="#1f2937" text-anchor="middle">[audit]</text>
  <text x="299" y="142" font-size="10.5" fill="#1f2937" text-anchor="middle">[console]</text>
  <text x="388" y="142" font-size="10.5" fill="#1f2937" text-anchor="middle">[audit]</text>
  <text x="508" y="142" font-size="10.5" fill="#1f2937" text-anchor="middle">[console]</text>
  <text x="597" y="142" font-size="10.5" fill="#1f2937" text-anchor="middle">[audit]</text>

  <text x="24" y="178" font-size="11" fill="#5b6472">接收方横条落在 publish 的虚线框内 ⇒ 发布方返回时它们已经跑完。</text>

  <!-- 下半：层 4 -->
  <text x="24" y="212" font-size="12" font-weight="700" fill="#1f2937">层 4 —— Publish 返回时，接收方一条都没跑</text>

  <rect x="40" y="228" width="56" height="16" rx="3" fill="#0c447c"/>
  <rect x="104" y="228" width="56" height="16" rx="3" fill="#0c447c"/>
  <rect x="168" y="228" width="56" height="16" rx="3" fill="#0c447c"/>
  <text x="68" y="240" font-size="10.5" fill="#ffffff" text-anchor="middle">25.0</text>
  <text x="132" y="240" font-size="10.5" fill="#ffffff" text-anchor="middle">26.5</text>
  <text x="196" y="240" font-size="10.5" fill="#ffffff" text-anchor="middle">27.0</text>

  <text x="40" y="266" font-size="11" fill="#5b6472">三次都返回了 · pending=3 · dispatched=0</text>

  <line x1="296" y1="222" x2="296" y2="302" stroke="#b8c4d4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="296" y="320" font-size="11" fill="#5b6472" text-anchor="middle">Start() = io_context::run()</text>

  <rect x="312" y="228" width="304" height="72" rx="4" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="328" y="248" font-size="11" fill="#1f2937">[console] got 25.0  ·  [audit] got 25.0</text>
  <text x="328" y="268" font-size="11" fill="#1f2937">[console] got 26.5  ·  [audit] got 26.5</text>
  <text x="328" y="288" font-size="11" fill="#1f2937">[console] got 27.0  ·  [audit] got 27.0</text>

  <text x="24" y="342" font-size="11" fill="#5b6472">中间那段空白就是时间解耦：生产者早已返回，接收方还没开始。</text>

  <!-- 结论 -->
  <rect x="24" y="358" width="632" height="66" rx="6" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="40" y="382" font-size="12" fill="#1f2937">层 1–3 往上走，换来的是<tspan font-weight="700">一份名单换了个位置</tspan>；层 4 换来的是<tspan font-weight="700">这段时间</tspan>。</text>
  <text x="40" y="404" font-size="11" fill="#5b6472">代价也在同一处：层 4 的「撤销订阅」只有在队列排空之后，才等价于第 3 层的那一次。</text>
</svg>
