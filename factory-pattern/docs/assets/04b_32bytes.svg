<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="680" height="400" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#1f2937">std::function 的 32 字节里装了什么</text>
  <text x="24" y="50" font-size="12" fill="#5b6472">libstdc++ 实测布局（与 sizeof 一致）—— 一块缓冲 + 两个函数指针；具体划分是<tspan font-weight="700">实现选择，标准不保证</tspan>。</text>

  <!-- 偏移刻度 -->
  <text x="48" y="72" font-size="10" fill="#8a929c">0</text>
  <text x="340" y="72" font-size="10" fill="#8a929c" text-anchor="middle">16</text>
  <text x="486" y="72" font-size="10" fill="#8a929c" text-anchor="middle">24</text>
  <text x="632" y="72" font-size="10" fill="#8a929c" text-anchor="end">32</text>

  <!-- 主条：32 字节 -->
  <rect x="48" y="80" width="292" height="66" rx="4" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="194" y="106" font-size="11.5" font-weight="700" fill="#0c447c" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">_Any_data</text>
  <text x="194" y="124" font-size="10.5" fill="#0c447c" text-anchor="middle">小对象缓冲 16 字节</text>
  <text x="194" y="139" font-size="10" fill="#8a929c" text-anchor="middle">装 lambda 的状态</text>

  <rect x="340" y="80" width="146" height="66" rx="4" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="413" y="106" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">_M_invoker</text>
  <text x="413" y="126" font-size="10.5" fill="#5b6472" text-anchor="middle">8 字节函数指针</text>

  <rect x="486" y="80" width="146" height="66" rx="4" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="559" y="106" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">_M_manager</text>
  <text x="559" y="126" font-size="10.5" fill="#5b6472" text-anchor="middle">8 字节函数指针</text>

  <!-- 分叉 -->
  <path d="M 340 146 L 340 160 L 177 160 L 177 178" fill="none" stroke="#c9d4e2" stroke-width="1.3"/>
  <path d="M 340 146 L 340 160 L 503 160 L 503 178" fill="none" stroke="#c9d4e2" stroke-width="1.3"/>
  <path d="M 177 178 L 173 170 L 181 170 z" fill="#c9d4e2"/>
  <path d="M 503 178 L 499 170 L 507 170 z" fill="#c9d4e2"/>

  <!-- 装得下 -->
  <rect x="24" y="186" width="306" height="88" rx="6" fill="#eef7f0" stroke="#c2ddca"/>
  <text x="38" y="208" font-size="11.5" font-weight="700" fill="#276749">状态 ≤ 16 字节 → 直接放进缓冲</text>
  <rect x="38" y="220" width="120" height="22" rx="3" fill="#d7edde" stroke="#a9d4b8"/>
  <text x="98" y="235" font-size="10" fill="#276749" text-anchor="middle">lambda 状态</text>
  <rect x="158" y="220" width="120" height="22" rx="3" fill="#f0f2f5" stroke="#dde3ea"/>
  <text x="218" y="235" font-size="10" fill="#b0b7c1" text-anchor="middle">空</text>
  <text x="38" y="262" font-size="10.5" fill="#276749">堆分配：0 次</text>

  <!-- 装不下 -->
  <rect x="350" y="186" width="306" height="88" rx="6" fill="#fdf6e9" stroke="#e8d9b0"/>
  <text x="364" y="208" font-size="11.5" font-weight="700" fill="#8a6d1f">状态 &gt; 16 字节 → 堆上放一份，缓冲里只存指针</text>
  <rect x="364" y="220" width="120" height="22" rx="3" fill="#f7ecd3" stroke="#e0cd9a"/>
  <text x="424" y="235" font-size="10" fill="#8a6d1f" text-anchor="middle">指针 8 字节</text>
  <rect x="484" y="220" width="120" height="22" rx="3" fill="#f7ecd9" stroke="#e0cd9a" stroke-dasharray="3 2"/>
  <text x="544" y="235" font-size="10" fill="#8a6d1f" text-anchor="middle">堆：状态本体</text>
  <text x="364" y="262" font-size="10.5" fill="#8a6d1f">堆分配：1 次</text>

  <!-- 结论 -->
  <rect x="24" y="290" width="632" height="86" rx="6" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="40" y="312" font-size="12" fill="#1f2937">调用 <tspan font-family="ui-monospace, Menlo, monospace">fn()</tspan> 时，编译器 <tspan font-weight="700">不知道</tspan> 缓冲里装的是什么 —— 只能经 <tspan font-family="ui-monospace, Menlo, monospace">_M_invoker</tspan> 跳一次。</text>
  <text x="40" y="332" font-size="12" fill="#1f2937">这一层就是类型擦除的代价：<tspan font-weight="700">一次间接调用</tspan>。</text>
  <text x="40" y="354" font-size="12" fill="#5b6472">对照第 6 节实测：注册表（查表 + 这一跳）7.592 ns/op，是「不用工厂」基线 0.822 的 9.23 倍。</text>

</svg>
