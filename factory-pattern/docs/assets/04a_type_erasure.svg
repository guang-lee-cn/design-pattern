<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#1f2937">5 种调用形式，装成同一个类型</text>
  <text x="24" y="50" font-size="12" fill="#5b6472">它们长得完全不同，但对调用方只剩一个签名 —— 这就是「类型擦除」。</text>

  <!-- 5 种可调用物 -->
  <rect x="24" y="76" width="280" height="34" rx="4" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="36" y="97" font-size="10.5" fill="#0c447c" font-family="ui-monospace, Menlo, monospace">Sensor* make_temp();</text>
  <text x="292" y="97" font-size="10.5" fill="#8a929c" text-anchor="end">普通函数</text>

  <rect x="24" y="116" width="280" height="34" rx="4" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="36" y="137" font-size="10.5" fill="#0c447c" font-family="ui-monospace, Menlo, monospace">&amp;make_temp</text>
  <text x="292" y="137" font-size="10.5" fill="#8a929c" text-anchor="end">函数指针</text>

  <rect x="24" y="156" width="280" height="34" rx="4" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="36" y="177" font-size="10.5" fill="#0c447c" font-family="ui-monospace, Menlo, monospace">struct Maker { operator()(); }</text>
  <text x="292" y="177" font-size="10.5" fill="#8a929c" text-anchor="end">仿函数</text>

  <rect x="24" y="196" width="280" height="34" rx="4" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="36" y="217" font-size="10.5" fill="#0c447c" font-family="ui-monospace, Menlo, monospace">[]{ return std::make_unique&lt;TempSensor&gt;(); }</text>
  <text x="292" y="217" font-size="10.5" fill="#8a929c" text-anchor="end">lambda</text>

  <rect x="24" y="236" width="280" height="34" rx="4" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="36" y="257" font-size="10.5" fill="#0c447c" font-family="ui-monospace, Menlo, monospace">std::bind(&amp;X::make, &amp;x)</text>
  <text x="292" y="257" font-size="10.5" fill="#8a929c" text-anchor="end">成员函数绑定</text>

  <!-- 汇聚 -->
  <path d="M 306 93 C 370 93, 370 173, 420 173" fill="none" stroke="#c9d4e2" stroke-width="1.3"/>
  <path d="M 306 133 C 360 133, 370 173, 420 173" fill="none" stroke="#c9d4e2" stroke-width="1.3"/>
  <path d="M 306 173 L 420 173" fill="none" stroke="#c9d4e2" stroke-width="1.3"/>
  <path d="M 306 213 C 360 213, 370 173, 420 173" fill="none" stroke="#c9d4e2" stroke-width="1.3"/>
  <path d="M 306 253 C 370 253, 370 173, 420 173" fill="none" stroke="#c9d4e2" stroke-width="1.3"/>

  <!-- 目标：一个类型 -->
  <rect x="420" y="143" width="236" height="60" rx="6" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="538" y="168" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">std::function&lt;unique_ptr&lt;Sensor&gt;()&gt;</text>
  <text x="538" y="188" font-size="10.5" fill="#8a929c" text-anchor="middle">一个类型 · 一个签名</text>

  <!-- 结论 -->
  <rect x="24" y="284" width="632" height="48" rx="6" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="40" y="304" font-size="12" fill="#1f2937">装进去的东西内部结构各不相同，但调用方只看到一个签名 —— 这一层<tspan font-weight="700">抹掉类型差异</tspan>的动作，叫类型擦除。</text>
  <text x="40" y="322" font-size="12" fill="#5b6472">代价是一次间接调用；换来的是：注册表只需要一条 Creator 类型，装什么都行。</text>

</svg>
