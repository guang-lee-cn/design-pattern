<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 412" width="680" height="412" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="680" height="412" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#1f2937">三个指针，一个静态类型，三种销毁方式</text>
  <text x="24" y="50" font-size="12" fill="#5b6472">编译器只看得懂最上面那一行；下面三行的差异，类型系统一无所知。</text>

  <!-- 列头 -->
  <text x="200" y="80" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="middle">HeapSensor</text>
  <text x="384" y="80" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="middle">MallocSensor</text>
  <text x="568" y="80" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="middle">PoolSensor</text>

  <!-- 行 1 · 静态类型 -->
  <text x="24" y="106" font-size="11" font-weight="700" fill="#b3261e">静态类型</text>
  <text x="24" y="122" font-size="9.5" fill="#b3261e">编译器只看到这里</text>

  <rect x="112" y="90" width="176" height="38" rx="4" fill="#eef2f7" stroke="#9aa8b8"/>
  <text x="200" y="114" font-size="12" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">Product* a</text>
  <rect x="296" y="90" width="176" height="38" rx="4" fill="#eef2f7" stroke="#9aa8b8"/>
  <text x="384" y="114" font-size="12" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">Product* b</text>
  <rect x="480" y="90" width="176" height="38" rx="4" fill="#eef2f7" stroke="#9aa8b8"/>
  <text x="568" y="114" font-size="12" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">Product* c</text>

  <!-- 行 2 · 指向哪 -->
  <text x="24" y="165" font-size="11" fill="#5b6472">指向哪</text>

  <rect x="112" y="142" width="176" height="38" rx="4" fill="#ffffff" stroke="#dfe4ea"/>
  <text x="200" y="166" font-size="10.5" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">0x584e911a92c0</text>
  <rect x="296" y="142" width="176" height="38" rx="4" fill="#ffffff" stroke="#dfe4ea"/>
  <text x="384" y="166" font-size="10.5" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">0x584e911a92e0</text>
  <rect x="480" y="142" width="176" height="38" rx="4" fill="#ffffff" stroke="#dfe4ea"/>
  <text x="568" y="166" font-size="10.5" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">0x584e911a9300</text>

  <!-- 行 3 · 怎么造 -->
  <text x="24" y="217" font-size="11" fill="#5b6472">怎么造</text>

  <rect x="112" y="194" width="176" height="38" rx="4" fill="#ffffff" stroke="#dfe4ea"/>
  <text x="200" y="218" font-size="10.5" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">new HeapSensor(25.0)</text>
  <rect x="296" y="194" width="176" height="38" rx="4" fill="#ffffff" stroke="#dfe4ea"/>
  <text x="384" y="218" font-size="10.5" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">malloc + placement new</text>
  <rect x="480" y="194" width="176" height="38" rx="4" fill="#ffffff" stroke="#dfe4ea"/>
  <text x="568" y="218" font-size="10.5" fill="#1f2937" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">PoolSensor::acquire()</text>

  <!-- 行 4 · 正确销毁 -->
  <text x="24" y="279" font-size="11" font-weight="700" fill="#276749">正确销毁</text>

  <rect x="112" y="246" width="176" height="62" rx="4" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="200" y="272" font-size="11" fill="#1b5e20" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">delete p</text>
  <text x="200" y="294" font-size="10" fill="#4a7a52" text-anchor="middle">析构 + 归还，一步到位</text>

  <rect x="296" y="246" width="176" height="62" rx="4" fill="#fde8e8" stroke="#e57373"/>
  <text x="384" y="268" font-size="11" font-weight="700" fill="#b3261e" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">p-&gt;~MallocSensor();</text>
  <text x="384" y="285" font-size="11" font-weight="700" fill="#b3261e" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">std::free(p);</text>
  <text x="384" y="301" font-size="9.5" fill="#b3261e" text-anchor="middle">两步，顺序还不能反</text>

  <rect x="480" y="246" width="176" height="62" rx="4" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="568" y="272" font-size="11" fill="#1f4e79" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">PoolSensor::release(p)</text>
  <text x="568" y="294" font-size="10" fill="#3b6ea5" text-anchor="middle">还回池子，不是还给系统</text>

  <!-- 结论 -->
  <rect x="24" y="320" width="632" height="82" rx="6" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="40" y="342" font-size="11.5" fill="#1f2937">「三行都是合法 C++」—— <tspan font-weight="700">写错任意一行，编译器一声不吭</tspan>：三者的静态类型完全相同，类型系统没机会拦。</text>
  <text x="40" y="364" font-size="11.5" fill="#1f2937">实测里的意外是：<tspan font-weight="700" fill="#b3261e">连人肉提示都写不全</tspan>。</text>
  <text x="40" y="384" font-size="11.5" fill="#5b6472">注释里提示 <tspan font-family="ui-monospace, Menlo, monospace">std::free(b)</tspan>，实测 <tspan font-family="ui-monospace, Menlo, monospace">[MallocSensor] 析构</tspan> 没有打印 —— free 不调析构，正确写法要先显式调析构。</text>
</svg>
