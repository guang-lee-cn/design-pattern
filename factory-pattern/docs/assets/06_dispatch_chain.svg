<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" width="680" height="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="680" height="424" fill="#ffffff"/>

  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#a0aec0"/>
    </marker>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#e57373"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#1f2937">同样一次 read()，差在「间接」走了几步</text>
  <text x="24" y="50" font-size="12" fill="#5b6472">从调用点到函数体之间，每一次间接跳转都要先读一次内存取地址。链越长，越贵。</text>

  <!-- 表头 -->
  <text x="24" y="76" font-size="11" font-weight="700" fill="#8a929c">方案</text>
  <text x="178" y="76" font-size="11" font-weight="700" fill="#8a929c">从调用到返回要走的环节</text>
  <text x="496" y="76" font-size="11" font-weight="700" fill="#8a929c">间接跳转</text>
  <text x="656" y="76" font-size="11" font-weight="700" fill="#8a929c" text-anchor="end">耗时 · 相对基线</text>

  <line x1="24" y1="84" x2="656" y2="84" stroke="#e3e8ef"/>

  <!-- ================= 行 0：基线 ================= -->
  <text x="24" y="103" font-size="11.5" font-weight="700" fill="#1f2937">0 无工厂（基线）</text>
  <text x="24" y="118" font-size="10.5" fill="#8a929c">直接拿指针就去调</text>
  <rect x="178" y="92" width="140" height="28" rx="4" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="248" y="111" font-size="11.5" fill="#1f2937" text-anchor="middle">p-&gt;read()</text>
  <rect x="496" y="97" width="18" height="18" rx="3" fill="#f0a04b" stroke="#d98428"/>
  <rect x="520" y="97" width="18" height="18" rx="3" fill="#f6f7f9" stroke="#dfe4ea" stroke-dasharray="3 2"/>
  <rect x="544" y="97" width="18" height="18" rx="3" fill="#f6f7f9" stroke="#dfe4ea" stroke-dasharray="3 2"/>
  <text x="656" y="103" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="end">0.822 ns</text>
  <text x="656" y="118" font-size="10.5" fill="#8a929c" text-anchor="end">1.00x</text>

  <!-- ================= 行 1：简单工厂 ================= -->
  <text x="24" y="155" font-size="11.5" font-weight="700" fill="#1f2937">1 简单工厂</text>
  <text x="24" y="170" font-size="10.5" fill="#8a929c">一次字符串比较</text>
  <rect x="178" y="144" width="98" height="28" rx="4" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="227" y="163" font-size="11.5" fill="#1f2937" text-anchor="middle">strcmp</text>
  <path d="M 276 158 L 288 158" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="292" y="144" width="98" height="28" rx="4" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="341" y="163" font-size="11.5" fill="#1f2937" text-anchor="middle">read()</text>
  <rect x="496" y="149" width="18" height="18" rx="3" fill="#f0a04b" stroke="#d98428"/>
  <rect x="520" y="149" width="18" height="18" rx="3" fill="#f6f7f9" stroke="#dfe4ea" stroke-dasharray="3 2"/>
  <rect x="544" y="149" width="18" height="18" rx="3" fill="#f6f7f9" stroke="#dfe4ea" stroke-dasharray="3 2"/>
  <text x="656" y="155" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="end">1.005 ns</text>
  <text x="656" y="170" font-size="10.5" fill="#8a929c" text-anchor="end">1.22x</text>

  <!-- ================= 行 2：工厂方法 ================= -->
  <text x="24" y="207" font-size="11.5" font-weight="700" fill="#1f2937">2 工厂方法</text>
  <text x="24" y="222" font-size="10.5" fill="#8a929c">虚调用套虚调用</text>
  <rect x="178" y="196" width="98" height="28" rx="4" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="227" y="215" font-size="11.5" fill="#1f2937" text-anchor="middle">create()</text>
  <path d="M 276 210 L 288 210" stroke="#a0aec0" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="292" y="196" width="98" height="28" rx="4" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="341" y="215" font-size="11.5" fill="#1f2937" text-anchor="middle">read()</text>
  <rect x="496" y="201" width="18" height="18" rx="3" fill="#e2703a" stroke="#c4561f"/>
  <rect x="520" y="201" width="18" height="18" rx="3" fill="#e2703a" stroke="#c4561f"/>
  <rect x="544" y="201" width="18" height="18" rx="3" fill="#f6f7f9" stroke="#dfe4ea" stroke-dasharray="3 2"/>
  <text x="656" y="207" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="end">1.465 ns</text>
  <text x="656" y="222" font-size="10.5" fill="#8a929c" text-anchor="end">1.78x</text>

  <!-- ================= 行 3：注册表（危险） ================= -->
  <rect x="16" y="248" width="648" height="52" rx="6" fill="#fdf6f6"/>
  <text x="24" y="269" font-size="11.5" font-weight="700" fill="#b3261e">3 注册表</text>
  <text x="24" y="284" font-size="10.5" fill="#b3261e">最贵，却常被当成轻写法</text>
  <rect x="178" y="258" width="80" height="28" rx="4" fill="#fde8e8" stroke="#e57373"/>
  <text x="218" y="277" font-size="11.5" fill="#b3261e" text-anchor="middle">map.find</text>
  <path d="M 258 272 L 270 272" stroke="#e57373" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="274" y="258" width="80" height="28" rx="4" fill="#fde8e8" stroke="#e57373"/>
  <text x="314" y="277" font-size="11.5" fill="#b3261e" text-anchor="middle">function</text>
  <path d="M 354 272 L 366 272" stroke="#e57373" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="370" y="258" width="80" height="28" rx="4" fill="#fde8e8" stroke="#e57373"/>
  <text x="410" y="277" font-size="11.5" fill="#b3261e" text-anchor="middle">read()</text>
  <rect x="496" y="263" width="18" height="18" rx="3" fill="#b3261e" stroke="#8f1d17"/>
  <rect x="520" y="263" width="18" height="18" rx="3" fill="#b3261e" stroke="#8f1d17"/>
  <rect x="544" y="263" width="18" height="18" rx="3" fill="#b3261e" stroke="#8f1d17"/>
  <text x="656" y="269" font-size="11.5" font-weight="700" fill="#b3261e" text-anchor="end">7.592 ns</text>
  <text x="656" y="284" font-size="10.5" font-weight="700" fill="#b3261e" text-anchor="end">9.23x</text>

  <!-- ================= 行 4：variant ================= -->
  <text x="24" y="331" font-size="11.5" font-weight="700" fill="#1b5e20">4 variant</text>
  <text x="24" y="346" font-size="10.5" fill="#1b5e20">零间接，比基线还快</text>
  <rect x="178" y="320" width="272" height="28" rx="4" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="314" y="339" font-size="11.5" fill="#1b5e20" text-anchor="middle">visit 在编译期展开 → read() 直接内联</text>
  <rect x="496" y="325" width="18" height="18" rx="3" fill="#f6f7f9" stroke="#dfe4ea" stroke-dasharray="3 2"/>
  <rect x="520" y="325" width="18" height="18" rx="3" fill="#f6f7f9" stroke="#dfe4ea" stroke-dasharray="3 2"/>
  <rect x="544" y="325" width="18" height="18" rx="3" fill="#f6f7f9" stroke="#dfe4ea" stroke-dasharray="3 2"/>
  <text x="656" y="331" font-size="11.5" font-weight="700" fill="#1b5e20" text-anchor="end">0.339 ns</text>
  <text x="656" y="346" font-size="10.5" font-weight="700" fill="#1b5e20" text-anchor="end">0.41x</text>

  <!-- 结论 -->
  <rect x="24" y="368" width="632" height="44" rx="6" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="40" y="388" font-size="12" fill="#1f2937">注册表的 9.23x，量的不是「多了一层函数」，而是<tspan font-weight="700">每一层间接都要读一次内存取地址</tspan>。</text>
  <text x="40" y="406" font-size="12" fill="#5b6472">换成 enum 键能省掉树查找，但省不掉类型擦除那一层——要连根去掉，只有 variant。</text>

</svg>
