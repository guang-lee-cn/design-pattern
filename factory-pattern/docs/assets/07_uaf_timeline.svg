<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 448" width="680" height="448" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="680" height="448" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#1f2937">缓存工厂的悬垂指针：四拍</text>
  <text x="24" y="52" font-size="12" fill="#5b6472">同一个地址，工厂和调用方各以为对方管着它 —— 动图版见 07_uaf_timeline.gif</text>

  <rect x="24" y="76" width="632" height="60" rx="6" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="44" y="114" font-size="13" font-weight="700" fill="#0c447c" font-family="ui-monospace, Menlo, monospace">t1</text>
  <text x="96" y="113" font-size="12" fill="#1f2937">工厂 create() 交出一个地址，同时把地址存进缓存</text>
  <text x="636" y="114" font-size="10.5" fill="#0c447c" text-anchor="end">内存：存活</text>
  <path d="M 340 138 L 340 144" stroke="#c9d4e2" stroke-width="1.3"/>
  <path d="M 340 145 L 336 140 L 344 140 z" fill="#c9d4e2"/>
  <rect x="24" y="146" width="632" height="60" rx="6" fill="#fdf2f2" stroke="#e8c4c4"/>
  <text x="44" y="184" font-size="13" font-weight="700" fill="#9b2c2c" font-family="ui-monospace, Menlo, monospace">t2</text>
  <text x="96" y="183" font-size="12" fill="#1f2937">调用方 delete s —— 内存没了，缓存里那个地址一个字节没改</text>
  <text x="636" y="184" font-size="10.5" fill="#9b2c2c" text-anchor="end">内存：已释放</text>
  <path d="M 340 208 L 340 214" stroke="#c9d4e2" stroke-width="1.3"/>
  <path d="M 340 215 L 336 210 L 344 210 z" fill="#c9d4e2"/>
  <rect x="24" y="216" width="632" height="60" rx="6" fill="#fdf2f2" stroke="#e8c4c4"/>
  <text x="44" y="254" font-size="13" font-weight="700" fill="#9b2c2c" font-family="ui-monospace, Menlo, monospace">t3</text>
  <text x="96" y="253" font-size="12" fill="#1f2937">再次 get("temp") —— 从缓存拿出那个地址，它已经指向一片死内存</text>
  <text x="636" y="254" font-size="10.5" fill="#9b2c2c" text-anchor="end">缓存指针：悬垂</text>
  <path d="M 340 278 L 340 284" stroke="#c9d4e2" stroke-width="1.3"/>
  <path d="M 340 285 L 336 280 L 344 280 z" fill="#c9d4e2"/>
  <rect x="24" y="286" width="632" height="60" rx="6" fill="#fdf2f2" stroke="#e8c4c4"/>
  <text x="44" y="324" font-size="13" font-weight="700" fill="#9b2c2c" font-family="ui-monospace, Menlo, monospace">t4</text>
  <text x="96" y="323" font-size="12" fill="#1f2937">s->read() 访问 name —— 读已释放内存，当场被拦下</text>
  <text x="636" y="324" font-size="10.5" fill="#9b2c2c" text-anchor="end">ASan：use-after-free</text>
  <rect x="24" y="362" width="632" height="62" rx="6" fill="#fdf2f2" stroke="#e8c4c4"/>
  <text x="44" y="388" font-size="12" font-weight="700" fill="#9b2c2c">AddressSanitizer：heap-use-after-free</text>
  <text x="44" y="410" font-size="11.5" fill="#9b2c2c">READ of size 8 —— basic_string::size() ← Sensor::read() ← main　（退出码 1）</text>

</svg>
