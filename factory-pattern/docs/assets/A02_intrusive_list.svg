<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 412" width="680" height="412" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="680" height="412" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#1f2937">节点放在哪，决定了启动期要不要 malloc</text>
  <text x="24" y="50" font-size="12" fill="#5b6472">同样是「登记 + 按名字查」，一个把节点放进堆，一个把节点嵌进静态对象。</text>

  <!-- ================= 左：map ================= -->
  <rect x="24" y="64" width="316" height="248" rx="8" fill="#fbfcfd" stroke="#e3e8ef"/>
  <text x="40" y="88" font-size="12.5" font-weight="700" fill="#b3261e">map&lt;string, function&gt;</text>
  <text x="40" y="105" font-size="10" fill="#8a929c">我们第 4 节的注册表</text>

  <rect x="40" y="118" width="108" height="38" rx="4" fill="#ffffff" stroke="#c9d4e2"/>
  <text x="94" y="135" font-size="10.5" fill="#1f2937" text-anchor="middle">map 对象</text>
  <text x="94" y="150" font-size="9.5" fill="#8a929c" text-anchor="middle">静态存储期</text>

  <path d="M 148 126 L 186 126" stroke="#c9d4e2" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M 148 137 L 186 168" stroke="#c9d4e2" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M 148 148 L 186 210" stroke="#c9d4e2" stroke-width="1.2" stroke-dasharray="3 2"/>

  <rect x="190" y="112" width="132" height="28" rx="4" fill="#fde8e8" stroke="#e57373"/>
  <text x="256" y="130" font-size="10" fill="#b3261e" text-anchor="middle">节点 ①　new 出来的</text>
  <rect x="190" y="154" width="132" height="28" rx="4" fill="#fde8e8" stroke="#e57373"/>
  <text x="256" y="172" font-size="10" fill="#b3261e" text-anchor="middle">节点 ②　new 出来的</text>
  <rect x="190" y="196" width="132" height="28" rx="4" fill="#fde8e8" stroke="#e57373"/>
  <text x="256" y="214" font-size="10" fill="#b3261e" text-anchor="middle">节点 ③　new 出来的</text>

  <text x="40" y="262" font-size="11.5" font-weight="700" fill="#b3261e">每次注册 = 1 次堆分配</text>
  <text x="40" y="280" font-size="10.5" fill="#5b6472">查找 O(log n)</text>
  <text x="40" y="298" font-size="10.5" fill="#5b6472">静态初始化顺序敏感</text>

  <!-- ================= 右：LLVM ================= -->
  <rect x="344" y="64" width="312" height="248" rx="8" fill="#fbfcfd" stroke="#e3e8ef"/>
  <text x="360" y="88" font-size="12.5" font-weight="700" fill="#1b5e20">llvm::Registry&lt;T&gt;</text>
  <text x="360" y="105" font-size="10" fill="#8a929c">node 是静态对象自己的一块</text>

  <rect x="360" y="112" width="280" height="34" rx="4" fill="#ffffff" stroke="#c9d4e2"/>
  <text x="372" y="134" font-size="10" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">X("fancy-gc", ...)</text>
  <rect x="556" y="112" width="84" height="34" rx="4" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="598" y="127" font-size="10" fill="#1b5e20" text-anchor="middle">node</text>
  <text x="598" y="140" font-size="9" fill="#4a7a52" text-anchor="middle">next ↓</text>

  <path d="M 598 148 L 598 158" stroke="#7fa98a" stroke-width="1.3"/>

  <rect x="360" y="160" width="280" height="34" rx="4" fill="#ffffff" stroke="#c9d4e2"/>
  <text x="372" y="182" font-size="10" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">Y("other-gc", ...)</text>
  <rect x="556" y="160" width="84" height="34" rx="4" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="598" y="175" font-size="10" fill="#1b5e20" text-anchor="middle">node</text>
  <text x="598" y="188" font-size="9" fill="#4a7a52" text-anchor="middle">next ↓</text>

  <path d="M 598 196 L 598 206" stroke="#7fa98a" stroke-width="1.3"/>

  <rect x="360" y="208" width="280" height="34" rx="4" fill="#ffffff" stroke="#c9d4e2"/>
  <text x="372" y="230" font-size="10" fill="#1f2937" font-family="ui-monospace, Menlo, monospace">Z("edge-gc", ...)</text>
  <rect x="556" y="208" width="84" height="34" rx="4" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="598" y="223" font-size="10" fill="#1b5e20" text-anchor="middle">node</text>
  <text x="598" y="236" font-size="9" fill="#4a7a52" text-anchor="middle">next → 空</text>

  <text x="360" y="262" font-size="11.5" font-weight="700" fill="#1b5e20">每次注册 = 0 次堆分配</text>
  <text x="360" y="280" font-size="10.5" fill="#5b6472">查找 O(n)，n = 插件数（个位数）</text>
  <text x="360" y="298" font-size="10.5" fill="#5b6472">链表拼接，与初始化顺序无关</text>

  <!-- 结论 -->
  <rect x="24" y="330" width="632" height="74" rx="6" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="40" y="352" font-size="11.5" fill="#1f2937">「零堆分配」不是技巧，是<tspan font-weight="700">知道规模之后的选择</tspan> —— 插件数是个位数。</text>
  <text x="40" y="372" font-size="11.5" fill="#1f2937">用 O(n) 的链表换掉「每注册一次就 malloc 一次」，划算；唯一变坏的是查找。</text>
  <text x="40" y="392" font-size="11.5" fill="#5b6472">而查找只发生在启动期、且只发生个位数次。代价的另一面：迭代顺序变成插入顺序。</text>
</svg>
