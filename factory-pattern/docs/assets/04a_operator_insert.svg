<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" width="680" height="396" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="680" height="396" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#1f2937">查表用 <tspan font-family="ui-monospace, Menlo, monospace">[]</tspan>，表会变大</text>
  <text x="24" y="50" font-size="12" fill="#5b6472">operator[] 的语义是「不存在就插入」—— 它没有「只读」这个用法。</text>

  <!-- ============ before ============ -->
  <text x="24" y="78" font-size="11.5" font-weight="700" fill="#1f2937">before<tspan font-size="10.5" font-weight="400" fill="#8a929c">　table().size() == 2</tspan></text>

  <rect x="24" y="88" width="380" height="76" rx="6" fill="#fbfcfd" stroke="#c9d4e2"/>
  <rect x="32" y="96" width="130" height="28" rx="3" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="97" y="115" font-size="10.5" fill="#0c447c" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">"temp"</text>
  <rect x="166" y="96" width="230" height="28" rx="3" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="178" y="115" font-size="10.5" fill="#1f2937">→ lambda：造 TempSensor</text>

  <rect x="32" y="130" width="130" height="28" rx="3" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="97" y="149" font-size="10.5" fill="#0c447c" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">"pressure"</text>
  <rect x="166" y="130" width="230" height="28" rx="3" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="178" y="149" font-size="10.5" fill="#1f2937">→ lambda：造 PressureSensor</text>

  <!-- ============ after ============ -->
  <text x="24" y="196" font-size="11.5" font-weight="700" fill="#1f2937">after<tspan font-size="10.5" font-weight="400" fill="#8a929c" font-family="ui-monospace, Menlo, monospace">　执行 table()["humidity"]; 之后</tspan><tspan font-size="10.5" font-weight="400" fill="#b3261e">　size() == 3</tspan></text>

  <rect x="24" y="206" width="380" height="112" rx="6" fill="#fbfcfd" stroke="#c9d4e2"/>
  <rect x="32" y="214" width="130" height="28" rx="3" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="97" y="233" font-size="10.5" fill="#0c447c" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">"temp"</text>
  <rect x="166" y="214" width="230" height="28" rx="3" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="178" y="233" font-size="10.5" fill="#1f2937">→ lambda：造 TempSensor</text>

  <rect x="32" y="248" width="130" height="28" rx="3" fill="#e8f0fe" stroke="#c7d7f5"/>
  <text x="97" y="267" font-size="10.5" fill="#0c447c" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">"pressure"</text>
  <rect x="166" y="248" width="230" height="28" rx="3" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="178" y="267" font-size="10.5" fill="#1f2937">→ lambda：造 PressureSensor</text>

  <rect x="32" y="282" width="130" height="28" rx="3" fill="#fde8e8" stroke="#e57373" stroke-dasharray="4 3"/>
  <text x="97" y="301" font-size="10.5" fill="#b3261e" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">"humidity"</text>
  <rect x="166" y="282" width="230" height="28" rx="3" fill="#fde8e8" stroke="#e57373" stroke-dasharray="4 3"/>
  <text x="178" y="301" font-size="10.5" font-weight="700" fill="#b3261e">空 Creator（从没赋值）</text>

  <!-- 标注 -->
  <path d="M 404 296 L 420 296" stroke="#e57373" stroke-width="1.4"/>
  <path d="M 420 292 L 428 296 L 420 300 z" fill="#e57373"/>
  <text x="436" y="296" font-size="11" font-weight="700" fill="#b3261e">幽灵条目</text>
  <text x="436" y="314" font-size="10.5" fill="#b3261e">调它 → bad_function_call</text>

  <!-- 结论 -->
  <rect x="24" y="344" width="632" height="44" rx="6" fill="#eef2f7" stroke="#c9d4e2"/>
  <text x="40" y="364" font-size="12" fill="#1f2937">它把「查不到」悄悄换成了「插入一个空的」，而且不报错 —— <tspan font-weight="700">list() 会把这个幽灵当成真实条目列出来</tspan>。</text>
  <text x="40" y="382" font-size="12" fill="#5b6472">规则：写用 operator[]，查用 find()。registry.cpp 的 create() 用的就是 find。</text>

</svg>
